<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi tienda</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="encabezado">
    <h1>🎧 Ecommerce Audífonos Bluetooth Premium</h1>

    <p class="slogan">
      Sonido Inmersivo y Alta Calidad 🌎
    </p>
  </header>

  <div class="beneficios">
    <span>🚚 Envíos rápidos en Bogotá</span>
    <span>🔒 Compra 100% segura</span>
    <span>📦 Seguimiento de pedido</span>
    <span>🎧 Calidad premium</span>
  </div>

  <section class="catalogo">
    <h2>🎵 Encuentra tus audífonos ideales</h2>
    <p>Elige el estilo que mejor se adapte a ti</p>

    <div id="productos"></div>
  </section>

  <div class="carrito">
    <h2>🛒 Tu Carrito</h2>

    <ul id="lista-carrito"></ul>

    <div class="resumen">
      <p>
        🚚 Envío: <strong>Gratis</strong>
      </p>

      <p class="total">
        💰 Total: $<span id="total">0</span>
      </p>
    </div>

    <button class="vaciar" onclick="vaciarCarrito()">
      🧼 Vaciar Carrito
    </button>

    <button class="finalizar" onclick="finalizarCompra()">
      ✅ Finalizar Compra
    </button>
  </div>


  <script src="js/script.js"></script>
</body>
</html>
